# GitHub Action for converting CV from Markdown to PDF
name: Create CV PDF

# Run this workflow every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "convert_to_pdf"
  convert_to_pdf:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Check out your repository code so the workflow can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Use the official Pandoc action to convert the file
      - name: Convert Markdown to PDF
        uses: pandoc/pandoc-action@v4
        with:
          args: >- # Use '>' for multi-line arguments
            --standalone
            --from=markdown
            --to=pdf
            --output=Michael_Forbes_CV.pdf
            --variable=geometry:margin=1in
            README.md

      # Step 3: Upload the generated PDF as a build artifact
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: Michael_Forbes_CV.pdf

