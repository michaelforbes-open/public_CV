name: Build and commit CV in PDF and DOCX format from Markdown

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_commit_files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Inject Date and Time
        run: |
          sed -i "s|_Last updated:.*|_Last updated: $(date -d "@$(git log -1 --pretty=%ct)" --utc +"%d %B %Y at %H:%M %Z")_|g" michael_forbes_cv.md

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Convert Markdown to PDF
        run: |
          # Use the correct extension to disable compact lists
          pandoc michael_forbes_cv.md --from=markdown-compact_lists --to=pdf --output=Michael_Forbes_CV.pdf --variable=geometry:margin=1in

      - name: Convert Markdown to DOCX
        run: |
          # Use the correct extension here as well
          pandoc michael_forbes_cv.md --from=markdown-compact_lists --to=docx --reference-doc=reference.docx --output=Michael_Forbes_CV.docx

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated-CVs
          path: |
            Michael_Forbes_CV.pdf
            Michael_Forbes_CV.docx

      - name: Commit, Amend, and Force Push the changes
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf Michael_Forbes_CV.docx
          git commit --amend --no-edit
          git push --force

