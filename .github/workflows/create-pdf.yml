name: Build and commit CV in PDF and DOCX format from Markdown

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_commit_files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Inject Date and Time
        run: |
          sed -i "s|_Last updated:.*|_Last updated: $(date -d "@$(git log -1 --pretty=%ct)" --utc +"%d %B %Y at %H:%M %Z")_|g" michael_forbes_cv.md

      # --- NEW PRE-PROCESSING STEP ---
      - name: Pre-process Markdown to Create Loose Lists
        run: |
          # Create a temporary copy of the CV with blank lines added after each list item
          # This forces Pandoc to apply paragraph spacing correctly.
          sed '/^- /a\\n' michael_forbes_cv.md > temp_cv_for_conversion.md

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Convert Markdown to PDF
        run: |
          # Use the temporary, pre-processed file as the source
          pandoc temp_cv_for_conversion.md --from=markdown --to=pdf --output=Michael_Forbes_CV.pdf --variable=geometry:margin=1in

      - name: Convert Markdown to DOCX
        run: |
          # Use the temporary, pre-processed file as the source here too
          pandoc temp_cv_for_conversion.md --from=markdown --to=docx --reference-doc=reference.docx --output=Michael_Forbes_CV.docx

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated-CVs
          path: |
            Michael_Forbes_CV.pdf
            Michael_Forbes_CV.docx

      - name: Commit, Amend, and Force Push the changes
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          # IMPORTANT: We commit the ORIGINAL clean .md file, not the temporary one.
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf Michael_Forbes_CV.docx
          git commit --amend --no-edit
          git push --force
