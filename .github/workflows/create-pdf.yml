# GitHub Action to create a PDF and commit it to the repository, designed with the assistance of Google Gemini
name: Markdown to PDF CV converter

# Run this workflow every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build_pdf_from_md:
    runs-on: ubuntu-latest

    # Grant permissions for the action to write to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Check out repository with full history
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all branches and tags

      # Step 2: Inject Date and Time into the Markdown file
      - name: Inject Date and Time
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%d %B %Y at %H:%M %Z')
          # This command now finds the entire "Last updated" line and replaces it
          sed -i "s|_Last updated:.*|_Last updated: $COMMIT_DATE_|g" michael_forbes_cv.md

      # Step 3: Install Pandoc and the necessary LaTeX packages
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      # Step 4: Run the Pandoc command to convert the file
      - name: Convert Markdown to PDF
        run: |
          pandoc michael_forbes_cv.md \
            --from=markdown \
            --to=pdf \
            --output=Michael_Forbes_CV.pdf \
            --variable=geometry:margin=1in

      # Step 5: Upload the PDF as a downloadable artifact (Moved earlier)
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: Michael_Forbes_CV.pdf

      # Step 6: Configure Git for the commit
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # Step 7: Commit and push the generated PDF and updated MD file
      - name: Commit and Push Files
        run: |
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf
          if ! git diff-index --quiet --cached HEAD; then
            git commit -m "Automated CV build in PDF"
            git pull --rebase
            git push
          else
            echo "No changes to commit."
          fi
