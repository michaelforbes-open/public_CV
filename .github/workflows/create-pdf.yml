# GitHub Action for converting CV from Markdown to PDF
name: Create CV PDF

# Run this workflow every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "convert_to_pdf"
  convert_to_pdf:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Check out your repository code so the workflow can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Use a pre-built action to convert the Markdown file to PDF
      - name: Convert Markdown to PDF
        uses: baileythegreen/action-markdown-to-pdf@v1
        with:
          # The input file to convert (e.g., your CV in Markdown)
          input_file: README.md
          # The name of the output PDF file
          output_file: Michael_Forbes_CV.pdf
          # Optional: Add extra arguments for Pandoc for more customization
          # For example, to use a different font or adjust margins
          # pandoc_args: "--variable=mainfont:Roboto --variable=geometry:margin=1in"

      # Step 3: Upload the generated PDF as a build artifact
      # This makes the PDF downloadable from the Actions tab
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          # The name of the artifact to be uploaded
          name: CV-PDF
          # The path to the file(s) to upload
          path: Michael_Forbes_CV.pdf
