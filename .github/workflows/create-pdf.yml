name: Build and commit CV in PDF and DOCX format from Markdown

# This workflow runs every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

# Grant permissions for the entire workflow run to write to the repository
permissions:
  contents: write

jobs:
  build_and_commit_files:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository with full history
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Step 2: Inject Date and Time into the Markdown file
      - name: Inject Date and Time
        run: |
          sed -i "s|_Last updated:.*|_Last updated: $(date -d "@$(git log -1 --pretty=%ct)" --utc +"%d %B %Y at %H:%M %Z")_|g" michael_forbes_cv.md

      # Step 3: Install Pandoc and the necessary LaTeX packages
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      # Step 4: Convert Markdown to PDF
      - name: Convert Markdown to PDF
        run: |
          pandoc michael_forbes_cv.md --from=markdown --to=pdf --output=Michael_Forbes_CV.pdf --variable=geometry:margin=1in

      # Step 5: Convert Markdown to DOCX
      - name: Convert Markdown to DOCX
        run: |
          pandoc michael_forbes_cv.md --from=markdown --to=docx --reference-doc=reference.docx --output=Michael_Forbes_CV.docx

      # Step 6: Upload PDF and DOCX artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated-CVs
          path: |
            Michael_Forbes_CV.pdf
            Michael_Forbes_CV.docx

      # Step 7: Commit, Amend, and Force Push the changes
      - name: Commit and Push Files
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          # IMPORTANT: Only add the files the bot is responsible for.
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf Michael_Forbes_CV.docx
          git commit --amend --no-edit
          git push --force

