name: Build and commit CV in PDF format from raw Markdown, created with the assistance of Google Gemini

# This workflow runs every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build_and_commit_pdf:
    runs-on: ubuntu-latest

    # Grant permissions for the action to write to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Check out repository with full history
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Step 2: Inject Date and Time into the Markdown file
      - name: Inject Date and Time
        run: |
          # This version pipes commands together to avoid shell variable issues.
          sed -i "s|_Last updated:.*|_Last updated: $(date -d "@$(git log -1 --pretty=%ct)" --utc +"%d %B %Y at %H:%M %Z")_|g" michael_forbes_cv.md

      # Step 3: Install Pandoc and the necessary LaTeX packages
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      # Step 4: Run the Pandoc command to convert the file
      - name: Convert Markdown to PDF
        run: |
          pandoc michael_forbes_cv.md \
            --from=markdown \
            --to=pdf \
            --output=Michael_Forbes_CV.pdf \
            --variable=geometry:margin=1in

      # Step 5: Upload the PDF as a downloadable artifact
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: Michael_Forbes_CV.pdf

      # Step 6: Commit, Amend, and Force Push the changes
      - name: Commit and Push Files
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf
          git commit --amend --no-edit
          git push --force
