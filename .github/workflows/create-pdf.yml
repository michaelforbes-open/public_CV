# GitHub Action to create a PDF and commit it to the repository, designed with the assistance of Google Gemini
name: Markdown to PDF CV converter

# Run this workflow every time a change is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build_pdf_from_md:
    runs-on: ubuntu-latest

    # Grant permissions for the action to write to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Check out repository with full history
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # This token is required to push to the branch
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Fetches all history

      # Step 2: Inject Date and Time into the Markdown file
      - name: Inject Date and Time
        run: |
          # Get the UNIX timestamp of the latest commit. This is the most reliable method.
          UNIX_TIMESTAMP=$(git log -1 --pretty=%ct)
          # Format the UNIX timestamp into a human-readable string
          COMMIT_DATE=$(date -d "@$UNIX_TIMESTAMP" --utc +"%d %B %Y at %H:%M %Z")
          # Replace the placeholder line with the newly formatted date
          sed -i "s|_Last updated:.*|_Last updated: $COMMIT_DATE_|g" michael_forbes_cv.md

      # Step 3: Install Pandoc and the necessary LaTeX packages
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      # Step 4: Run the Pandoc command to convert the file
      - name: Convert Markdown to PDF
        run: |
          pandoc michael_forbes_cv.md \
            --from=markdown \
            --to=pdf \
            --output=Michael_Forbes_CV.pdf \
            --variable=geometry:margin=1in

      # Step 5: Upload the PDF as a downloadable artifact
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: Michael_Forbes_CV.pdf

      # Step 6: Commit, Amend, and Force Push the changes
      - name: Commit and Push Files
        run: |
          # Configure Git to use the original commit's author
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          
          # Add the modified files
          git add michael_forbes_cv.md Michael_Forbes_CV.pdf
          
          # Amend the previous commit, keeping the original message
          # This adds the new files to your original commit
          git commit --amend --no-edit
          
          # Force push the amended commit to the branch
          git push --force
