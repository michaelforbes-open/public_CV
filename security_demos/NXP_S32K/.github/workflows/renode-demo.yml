name: S32K Vulnerability Demo
on: [push, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Renode
        run: |
          sudo apt-get update
          sudo apt-get install -y renode
          
      - name: Run Exploit Demo
        uses: antmicro/renode-test-action@v1
        with:
          tests-to-run: tests/exploit.robot
